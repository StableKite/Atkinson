name: Build and publish to devpi

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVPI_SERVER: https://stablekite.com:4438/
  DEVPI_TARGET_INDEX: https://stablekite.com:4438/StableKite/index/

jobs:
  build-wheels:
    name: Wheel
    strategy:
      fail-fast: false
      matrix:
        target:
          - Windows x86_64
          - manylinux x86_64
          - manylinux aarch64
          - musllinux x86_64
          - musllinux aarch64
        include:
          - target: Windows x86_64
            id: windows-x64
            runner: windows-latest
            cibw_build: cp314t-win_amd64

          - target: manylinux x86_64
            id: manylinux-x64
            runner: ubuntu-24.04
            cibw_build: cp314t-manylinux_x86_64

          - target: manylinux aarch64
            id: manylinux-arm64
            runner: ubuntu-24.04-arm
            cibw_build: cp314t-manylinux_aarch64

          - target: musllinux x86_64
            id: musllinux-x64
            runner: ubuntu-24.04
            cibw_build: cp314t-musllinux_x86_64

          - target: musllinux aarch64
            id: musllinux-arm64
            runner: ubuntu-24.04-arm
            cibw_build: cp314t-musllinux_aarch64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and test wheel
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_BUILD_VERBOSITY: "1"

          # This extension links only against the Python runtime and the
          # platform C runtime. There are no third-party Windows DLLs to
          # vendor into the wheel, so Windows repair is unnecessary.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""

          # Verify both the free-threaded interpreter and the actual compiled
          # extension after cibuildwheel installs the produced wheel.
          CIBW_TEST_COMMAND: >-
            python -c "import sysconfig, atkinson;
            assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1;
            result = atkinson.atk(0, 0, b'');
            assert result == b'', result;
            print('Atkinson extension OK:', atkinson.__file__)"
        with:
          output-dir: wheelhouse

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.id }}
          path: wheelhouse/*.whl
          if-no-files-found: error


  source:
    name: Source distribution
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14t
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build source distribution
        run: python -m build --sdist --outdir dist

      - name: Verify source distribution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile

          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(sdists) != 1:
              raise SystemExit(f"Expected exactly one sdist, got: {sdists}")

          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()

          required_suffixes = (
              "/setup.py",
              "/atkinson/atk.c",
              "/atkinson/__init__.py",
              "/atkinson/atkinson.pyi",
          )

          for suffix in required_suffixes:
              if not any(name.endswith(suffix) for name in names):
                  raise SystemExit(
                      f"Source distribution is missing required file: {suffix}"
                  )

          print(f"Source distribution OK: {sdists[0].name}")
          PY

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error


  publish:
    name: Publish to devpi
    needs:
      - build-wheels
      - source
    runs-on: ubuntu-24.04

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: incoming/wheels

      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: incoming/sdist

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Prepare and verify artifacts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil
          import tarfile
          import zipfile

          incoming = Path("incoming")
          dist = Path("dist")
          dist.mkdir(exist_ok=True)

          artifacts = sorted(
              path
              for path in incoming.rglob("*")
              if path.is_file()
              and (path.suffix == ".whl" or path.name.endswith(".tar.gz"))
          )

          wheels = [path for path in artifacts if path.suffix == ".whl"]
          sdists = [path for path in artifacts if path.name.endswith(".tar.gz")]

          if len(wheels) != 5:
              raise SystemExit(
                  f"Expected exactly five wheels, got: {[p.name for p in wheels]}"
              )
          if len(sdists) != 1:
              raise SystemExit(
                  f"Expected exactly one sdist, got: {[p.name for p in sdists]}"
              )

          def matches(name, family, arch):
              return (
                  "-cp314-cp314t-" in name
                  and family in name
                  and name.endswith(f"{arch}.whl")
              )

          expected = {
              "Windows x86_64": [
                  p for p in wheels
                  if "-cp314-cp314t-win_amd64.whl" in p.name
              ],
              "manylinux x86_64": [
                  p for p in wheels
                  if matches(p.name, "manylinux", "x86_64")
              ],
              "manylinux aarch64": [
                  p for p in wheels
                  if matches(p.name, "manylinux", "aarch64")
              ],
              "musllinux x86_64": [
                  p for p in wheels
                  if matches(p.name, "musllinux", "x86_64")
              ],
              "musllinux aarch64": [
                  p for p in wheels
                  if matches(p.name, "musllinux", "aarch64")
              ],
          }

          bad_targets = {
              target: [p.name for p in found]
              for target, found in expected.items()
              if len(found) != 1
          }
          if bad_targets:
              raise SystemExit(
                  f"Unexpected wheel target set: {bad_targets}; "
                  f"all wheels: {[p.name for p in wheels]}"
              )

          origins = {}

          for source in artifacts:
              if source.suffix == ".whl":
                  try:
                      with zipfile.ZipFile(source) as archive:
                          bad = archive.testzip()
                  except zipfile.BadZipFile as exc:
                      raise SystemExit(f"Invalid wheel {source}: {exc}") from exc

                  if bad is not None:
                      raise SystemExit(f"Invalid wheel {source}: bad member {bad}")

              else:
                  try:
                      with tarfile.open(source, "r:gz") as archive:
                          archive.getmembers()
                  except tarfile.TarError as exc:
                      raise SystemExit(f"Invalid sdist {source}: {exc}") from exc

              target = dist / source.name

              if not target.exists():
                  shutil.copy2(source, target)
                  origins[source.name] = source
                  continue

              old_hash = hashlib.sha256(target.read_bytes()).hexdigest()
              new_hash = hashlib.sha256(source.read_bytes()).hexdigest()

              if old_hash == new_hash:
                  print(f"Skipping identical duplicate: {source.name}")
                  continue

              first = origins.get(source.name, target)
              raise SystemExit(
                  "\nDifferent artifacts have the same filename:\n"
                  f"  {source.name}\n"
                  f"  first:  {first}\n"
                  f"  second: {source}\n"
              )

          print("\nArtifacts to publish:")
          for artifact in sorted(dist.iterdir()):
              print(f"  {artifact.name} ({artifact.stat().st_size} bytes)")
          PY

      - name: Install devpi tools
        run: >-
          python -m pip install
          devpi-client
          devpi-tokens
          "pypitoken>=6.0.1"

      - name: Publish
        env:
          DEVPI_TOKEN: ${{ secrets.DEVPI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DEVPI_TOKEN:-}" ]; then
            echo "::error::DEVPI_TOKEN is not available to this repository."
            exit 1
          fi

          TOKEN_FILE="$RUNNER_TEMP/devpi-token"
          printf '%s' "$DEVPI_TOKEN" > "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"
          trap 'rm -f "$TOKEN_FILE"' EXIT

          devpi use "$DEVPI_SERVER"
          devpi token-login -f "$TOKEN_FILE"
          devpi use "$DEVPI_TARGET_INDEX"
          devpi upload dist/*
